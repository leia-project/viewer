version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/" # location of package.json
    schedule:
      interval: "weekly"
      day: "sunday"
    target-branch: "development" # branch to create pull requests for

  - package-ecosystem: "docker"
    directory: "/" # location of Dockerfile
    schedule:
      interval: "weekly"
      day: "sunday"
    target-branch: "development"
